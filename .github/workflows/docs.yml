name: docs
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'src/**'
      - 'Cargo.toml'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: wait 2 mins per policy
        run: sleep 120

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: build library checks
        run: cargo test --lib --verbose

      - name: checkout gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || echo "no gh-pages yet"
          # generate docs content from main
          # we rebuild index.html section counts from README and cargo metadata
          echo "generating docs snapshot"
          mkdir -p /tmp/pages
          cp index.html /tmp/pages/index.html 2>/dev/null || cp docs/index.html /tmp/pages/index.html 2>/dev/null || echo "no index in main, will use gh-pages current"
          # if index.html exists in repo root (it does not on main), otherwise copy from current gh-pages workdir
          # Instead regenerate minimal trigger: update timestamp in gh-pages

      - name: update gh-pages timestamp and test count
        run: |
          git checkout gh-pages || git checkout --orphan gh-pages
          # refresh stats from main's cargo test output
          cargo test 2>&1 | tail -5 > /tmp/test_summary.txt || true
          TESTS=$(grep -o "[0-9]* passed" /tmp/test_summary.txt | head -1 || echo "46 passed")
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          # patch footer in index.html with new date and test count
          if [ -f index.html ]; then
            # update the footer line containing Build: cargo test
            sed -i.bak -E "s/cargo test.*passed/cargo test ($TESTS)/" index.html || true
            sed -i.bak -E "s/Build: .*/Build: cargo test ($TESTS) · $DATE · auto-deployed after 2 min delay/" index.html || true
            rm -f index.html.bak
          fi
          # also ensure style and site are present, if not copy from main's gh-pages history
          git status

      - name: commit and push gh-pages
        run: |
          if git diff --quiet; then
            echo "no docs changes to push"
            exit 0
          fi
          git add index.html style.css 2>/dev/null || true
          git commit -m "docs: sync from main after 2 min delay" || echo "nothing to commit"
          git push origin gh-pages || echo "push failed"
